
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: waterSim-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: waterSim-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped